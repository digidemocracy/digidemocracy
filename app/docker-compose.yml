# DEVELOPMENT ONLY. UNTESTED end-to-end. Run ./setup.sh first to generate ./digidemocracy_app.
# All secrets/passwords below are dev-only defaults - never reuse them in production.
x-app-env: &app-env
  RAILS_ENV: development
  DATABASE_HOST: db
  DATABASE_USERNAME: decidim
  DATABASE_PASSWORD: decidim
  REDIS_URL: redis://redis:6379/0
  # Official Decidim 0.32 env vars (read in decidim-core/lib/decidim/core.rb):
  DECIDIM_DEFAULT_LOCALE: ro
  DECIDIM_AVAILABLE_LOCALES: ro,en
  DECIDIM_FORCE_SSL: "false"
  # Dev-only placeholder. Generate a real one for any deployment: bin/rails secret
  SECRET_KEY_BASE: dev-only-insecure-secret-key-base-change-me-0000000000000000000000000000000000000000
  BUNDLE_PATH: /bundle

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: decidim
      POSTGRES_PASSWORD: decidim
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decidim"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    working_dir: /app
    volumes:
      - ./digidemocracy_app:/app
      - bundle:/bundle
      - node_modules:/app/node_modules
      - ../decidim-module-communities:/modules/decidim-module-communities
    ports:
      - "3000:3000"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  # Optional background worker. Decidim works in development with Rails' default
  # (async, in-process) ActiveJob adapter, so this is NOT started by default.
  # Enable only if the app was generated with `--queue sidekiq`:
  #   QUEUE_ADAPTER=sidekiq docker compose --profile worker up
  worker:
    build: .
    profiles: ["worker"]
    working_dir: /app
    command: ["bundle", "exec", "sidekiq"]
    volumes:
      - ./digidemocracy_app:/app
      - bundle:/bundle
      - node_modules:/app/node_modules
      - ../decidim-module-communities:/modules/decidim-module-communities
    environment:
      <<: *app-env
      RUN_DB_PREPARE: "0"
      QUEUE_ADAPTER: sidekiq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  bundle:
  node_modules:

# Development only. UNTESTED. Run ./setup.sh first to generate ./digidemocracy_app.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: decidim
      POSTGRES_PASSWORD: decidim
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7
  web:
    build: .
    working_dir: /app
    volumes:
      - ./digidemocracy_app:/app
      - bundle:/bundle
      - ../decidim-module-communities:/modules/decidim-module-communities
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://decidim:decidim@db/digidemocracy_development
      REDIS_URL: redis://redis:6379/0
      DECIDIM_DEFAULT_LOCALE: ro
      DECIDIM_AVAILABLE_LOCALES: ro,en
      RAILS_ENV: development
    depends_on: [db, redis]
volumes:
  pg_data:
  bundle:
